<script id="adaptive-device-detector">
(()=>{
  const root=document.documentElement;

  const mq={

    anyFine:matchMedia('(any-pointer: fine)'),
    anyHover:matchMedia('(any-hover: hover)'),
    reduced:matchMedia('(prefers-reduced-motion: reduce)'),
    contrast:matchMedia('(prefers-contrast: more)')
  };
  const update=()=>{
    const vv=window.visualViewport;
    const w=Math.round(vv?.width || document.documentElement.clientWidth || innerWidth || 0);
    const h=Math.round(vv?.height || innerHeight || 0);
    const sw=Math.round(screen?.width || w), sh=Math.round(screen?.height || h);
    const shortSide=Math.min(sw,sh,w,h);

    const fine=mq.anyFine.matches;
    const touchFirst=mq.coarse.matches && !fine;

    if(touch && shortSide < 600) device='phone';
    else if((touchFirst && shortSide < 1000) || (!fine && w < 1180)) device='tablet';
    else if(!touch && w < 720) device='desktop';
    root.dataset.device=device;
    root.dataset.layout=w < 720 ? 'compact' : (w < 1180 ? 'medium' : 'wide');
    root.dataset.input=touch ? (fine ? 'hybrid' : 'touch') : 'pointer';
    root.dataset.orientation=w>h ? 'landscape' : 'portrait';
    root.dataset.hover=mq.anyHover.matches ? 'hover' : 'none';
    root.dataset.motion=mq.reduced.matches ? 'reduced' : 'full';
    root.dataset.contrast=mq.contrast.matches ? 'more' : 'normal';
    root.style.setProperty('--viewport-width',`${w}px`);
    root.style.setProperty('--viewport-height',`${h}px`);
    root.style.setProperty('--safe-top','env(safe-area-inset-top, 0px)');
    root.style.setProperty('--safe-right','env(safe-area-inset-right, 0px)');
    root.style.setProperty('--safe-bottom','env(safe-area-inset-bottom, 0px)');
    root.style.setProperty('--safe-left','env(safe-area-inset-left, 0px)');
  };
  let raf=0;
  const queue=()=>{cancelAnimationFrame(raf);raf=requestAnimationFrame(update)};
  update();
  addEventListener('resize',queue,{passive:true});
  addEventListener('orientationchange',queue,{passive:true});
  visualViewport?.addEventListener('resize',queue,{passive:true});
  visualViewport?.addEventListener('scroll',queue,{passive:true});
  Object.values(mq).forEach(m=>m.addEventListener?.('change',queue));
})();
